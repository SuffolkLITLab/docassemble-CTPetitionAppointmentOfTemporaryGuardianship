metadata:
  title: >-
    Get a temporary guardian for a child in Connecticut 
  short title: >-
    Petition Appointment of T
  description: |-
    Use this form to request the appointment of a temporary guardian for a minor child. This process is initiated by a parent or court-appointed guardian who is unable to care for the child.
  can_I_use_this_form: |
    You can use this form if you are a parent or a court-appointed guardian of a minor (Note: Cannot be a temporary guardian). You can file it in the probate district where the child lives right now, is domiciled (has their permanent home), or is located at the time the petition is filed
  before_you_start: |
    ## Before you get started
    - Ensure you have the minor's birth certificate and the Affidavit Concerning Children (JD-FM-164).
    - Gather all necessary information about the minor and the proposed guardian.

    ## When you are finished
    - Submit the completed petition along with the required documents to the appropriate probate court.
  when_you_are_finished: |
    After submitting the petition, the court will review your request. You may need to attend a hearing where you can present your case for the appointment of a temporary guardian.
