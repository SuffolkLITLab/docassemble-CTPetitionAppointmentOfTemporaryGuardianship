# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: petition_appointment_of_tg_ct_pc504_with_fields_next_steps
  docx template file: petition_appointment_of_tg_ct_pc504_with_fields_next_steps.docx
  variable name: petition_appointment_of_tg_ct_pc504_with_fields_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: petition appointment of tg ct pc504 with fields
  filename: CTPetitionAppointmentOfTemporaryGuardianship
  variable name: petition_appointment_of_tg_ct_pc504_with_fields_attachment[i]
  skip undefined: True
  pdf template file: CTPetitionAppointmentOfTemporaryGuardianship.pdf
  fields:
      - "Probate_Court_Name": ${ Probate_Court_Name }
      - "District_No": ${ District_No }
      - "In_the_Matter_of": ${ In_the_Matter_of }
      - "Minor_Childs_Date_of_Birth": ${ Minor_Childs_Date_of_Birth.format() }
      - "Address_where_minor_child_resides": ${ Address_where_minor_child_resides }
      - "Address_where_minor_child_is_domiciled_if_different": ${ Address_where_minor_child_is_domiciled_if_different }
      - "Address_where_minor_child_is_located_at_time_of_filing_petition_if_different": ${ Address_where_minor_child_is_located_at_time_of_filing_petition_if_different }
      #- "Petitioner_Name_address_and_telephone_number": |
      - users1_name: ${ users[0].name_full() }
      - users1_address: ${ users[0].address_on_one_line() }
      - users1_telephone_number: ${ users[0].phone_numbers() }
      # ${ users1_Name_address_and_telephone_number }
      - "Proposed_Temporary_Guardian_Name_address_telephone_number_and_birth_date": ${ guardians1_Name_address_telephone_number_and_birth_date }
      - "Parent": ${ parent_or_court_appointed_guardian == "Parent" }
      - "Courtappointed_Guardian": ${ parent_or_court_appointed_guardian == "Court-Appointed Guardian" }
      - "Mother_Parent": ${ Mother_Parent }
      - "FatherParent_If_father_is_unknown_so_state": ${ FatherParent_If_father_is_unknown_so_state }
      - "Guardians_of_the_Person_of_the_Minor_Child": ${ Guardians_of_the_Person_of_the_Minor_Child }
      - "Reasons": ${ Reasons }
      - "has_resided": ${ has_resided }
      - "has_not_resided": ${ not has_resided  }
      - "is_a_proceeding": ${ current_proceeding } 
      - "is_not_a_proceeding": ${ not current_proceeding }
      - "has_been_a_proceeding": ${ past_proceeding } 
      - "has_not_been_a_proceeding": ${ not past_proceeding } 
      - "current_safety_service_agreement": ${ current_safety_service_agreement }
      - "no_current_safety_service_agreement": ${ not current_safety_service_agreement }
      - "current_protective_restraining_order": ${ current_protective_restraining_order }
      - "no_current_protective_restraining_order": ${ not current_protective_restraining_order }
      - "preexisting_child_support_order": ${ preexisting_child_support_order }
      - "no_preexisting_child_support_order": ${ not preexisting_child_support_order }
      - "Termination_date": ${ Termination_date.format() }
      - "users1_name__2": ${ users[0].name }
      - "users1_address": ${ users[0].address.address }
      - "users1_telephone_number": ${ users[0].telephone_number}
      - "Date1": ${ today() }
      - "users2_name": ${ users[1].name }
      - "Date2": ${ today() }
      # Check: maybe not used?
      - "guardians1_name": ${ guardians[0].name }
      - "guardians1_name__2": ${ guardians[0].name }
      - "Date3": ${ today() }
      - "guardians1_address__2": ${ guardians[0].address.on_one_line() }
      - "guardians1_address": ${ guardians[0].address.on_one_line() }
      - "guardians1_telephone_number__2": ${ guardians[0].telephone_number }
      - "guardians1_telephone_number": ${ guardians[0].telephone_number }
        
      - "guardians1_birth_date": ${ guardians[0].birth_date }
      - "guardians2_name__2": ${ guardians[1].name }
      - "Date4": ${ today() }
      - "guardians2_address": ${ guardians[1].address.on_one_line() }
      - "guardians2_telephone_number": ${ guardians[1].telephone_number }
      - "users1_signature": ${ users[0].signature }
      - "users2_signature": ${ users[1].signature }
      - "guardians1_signature": ${ guardians[0].signature }
      - "guardians2_signature": ${ guardians[1].signature }