id: Petition Appointment of TG CT PC 504 with fields intro
continue button field: petition_appointment_of_tg_ct_pc504_with_fields_intro
question: |
  Petition Appointment of TG CT PC-504 with fields
subquestion: |
  ## Before you get started
  - Ensure you have the minor's birth certificate and the Affidavit Concerning Children (JD-FM-164).
  - Gather all necessary information about the minor and the proposed guardian.

  ## When you are finished
  - Submit the completed petition along with the required documents to the appropriate probate court.

  You can use this form if you are a parent or a court-appointed guardian of a minor. Make sure to file it in the probate district where the child resides.
---
id: Petition Details
question: |
  Petition Details
subquestion: |
  Provide the basic details of the petition.
fields:
  - "Date petition received": users1_recieveddate
    datatype: date
  - "Probate court name": Probate_Court_Name
  - "District number": District_No
  - "In the matter of": In_the_Matter_of
---
id: Minor Child Information
question: |
  Minor Child Information
subquestion: |
  Enter the minor child's details.
fields:
  - "Minor child's date of birth": Minor_Childs_Date_of_Birth
    datatype: date
  - "Address where minor child resides": Address_where_minor_child_resides
  - label: Address where minor child is domiciled (if different from residence)
    field: Address_where_minor_child_is_domiciled_if_different
    required: False
  - label: Address where minor child is located (if different from residence)
    field: Address_where_minor_child_is_located_at_time_of_filing_petition_if_different
    required: False
---
id: question_1790104605424
question: Petitioner and Proposed Temporary Guardian Information
fields:
  - "Petitioner name, address, telephone number": Petitioner_Name_address_and_telephone_number
  - "Proposed Temporary Guardian name, address, telephone number": Proposed_Temporary_Guardian_Name_address_telephone_number_and_birth_date
---
id: code_1790087520699
question: Is the petitioner a parent or court-appointed guardian?
fields:
  - Parent: parent
    datatype: yesnoradio
  - Court-appointed guardian: court_appointed_guardian
    datatype: yesnoradio
---
id: Guardianship Rights
question: |
  Guardianship Rights
subquestion: |
  List individuals with guardianship rights. (For each person, list name, address,
  telephone number, including the date of birth for any person who is under the age of 18, any person in the military service
  or any person under conservatorship or legal disability)
fields:
  - "Mother's details": Mother_Parent
  - "Father's details or unknown status": FatherParent_If_father_is_unknown_so_state
  - label: Guardians of the minor child
    field: Guardians_of_the_Person_of_the_Minor_Child
    required: False
---
id: Reasons for Guardianship
question: |
  Reasons for Guardianship
subquestion: |
  State the reasons for requesting guardianship.
fields:
  - Reasons for guardianship request: Reasons
  - Has the minor child resided in Connecticut continuously for the past 6 months?: has_resided
    datatype: yesnoradio
  - "Is there a pending or contemplated proceeding in Connecticut or any state affecting the custody of the minor child ": has_not_resided
    datatype: yesnoradio
  - Pending or contemplated proceeding: is_a_proceeding
    datatype: yesnoradio
  - Pending or contemplated proceeding: is_not_a_proceeding
    datatype: yesnoradio
---
id: Legal Proceedings
question: |
  Legal Proceedings
subquestion: |
  Provide details about any legal proceedings.
fields:
  - Has there been a proceeding in the past in Connecticut or any state affecting the custody of the minor child: has_been_a_proceeding
    datatype: yesnoradio
  - Is there a current safety or service agreement between the Department of Children and Families and the parent/guardian of the minor child.: is_
    datatype: yesnoradio
  - Is there a current protective order or restraining order involving any party: is_not
    datatype: yesnoradio
  - label: "If YES to current protective or restraining order, please attach"
    field: protective_order_restraining_order
    datatype: url
    required: False
---
id: Guardianship Terms
question: |
  Guardianship Terms
subquestion: |
  Specify the terms of the proposed guardianship.
fields:
  - Termination date of guardianship (1 year maximum): Termination_date
    datatype: date
---
id: Signatures
question: |
  Signatures
subquestion: |
  Sign and provide details of the petitioners.
fields:
  - "Petitioner's Signature": Petitioners_Name
    datatype: area
  - Type or print name of petitioner: Type_or_Print_Name_1
  - "Date ": Date1
    datatype: date
  - label: "Petitioner's Signature "
    field: Petitioners_Name2
    datatype: area
    required: False
  - label: Type or print name of petitioner
    field: Type_or_Print_Name_2
    required: False
  - label: "Date "
    field: Date2
    datatype: date
    required: False
  - "Proposed Temporary Guardian Signature ": Proposed_Temporary_Guardian_name
    datatype: area
  - "Type or print name ": Type_or_Print_Name_3
  - Date: Date3
    datatype: date
  - Address: Address1
  - Telephone number: Telephone_number1
  - label: Proposed Temporary Guardian Signature
    field: Proposed_Temporary_Guardian_name2
    datatype: area
    required: False
  - label: "Type or print name "
    field: Type_or_Print_Name_4
    required: False
  - label: Date
    field: Date4
    datatype: date
    required: False
  - label: Address
    field: Address2
    required: False
  - label: Telephone number
    field: Telephone_number2
    required: False
