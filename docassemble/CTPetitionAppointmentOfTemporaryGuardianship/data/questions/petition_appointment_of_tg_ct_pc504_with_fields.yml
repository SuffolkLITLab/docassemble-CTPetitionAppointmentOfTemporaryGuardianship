id: Petition Appointment of TG CT PC 504 with fields intro
continue button field: petition_appointment_of_tg_ct_pc504_with_fields_intro
question: "Get a temporary guardian for my child in Connecticut"
subquestion: |2
  ## Before you get started
  - Make sure you have the child's birth certificate and the Affidavit Concerning Children (JD-FM-164).
  - Get all information about the child and the proposed guardian.
  
  ## When you are finished
  - Submit the completed petition along with the required documents to the appropriate probate court. There will be a document at the end of the interview that will tell you what to do next. 
  
  You can use this form if you are a parent or a court-appointed guardian of a minor. Make sure to file it in the probate district where the child resides. 
---
id: Petition Details
question: |2
  Petition details
subquestion: |2-
  Click this link to figure out which court name and district number is right for your petition: 
  [CT probate court locator](https://www.ctprobate.gov/court-locator)
fields:
  - Probate court name: Probate_Court_Name
  - District number: District_No
---
id: Child Information
question: |2
  Child information
fields:
  - "Child's last name (In the matter of)": In_the_Matter_of
  - when was the child born?: Minor_Childs_Date_of_Birth
    datatype: BirthDate
  - Where does the child live?: Address_where_minor_child_resides
  - label: "what is the address of child's permanent home? (if different from where child lives)"
    field: Address_where_minor_child_is_domiciled_if_different
    required: False
  - label: where is the child while this form is being filled out (if different from where child lives)
    field: Address_where_minor_child_is_located_at_time_of_filing_petition_if_different
    required: False
---
id: question_1792760732917
question: "Who is filling out this form? the child's Parent or a Court-appointed guardian? "
fields:
  - "Parent or Court-appointed guardian ": parent_or_court_appointed_guardian
    datatype: radio
    choices:
      - Parent
      - Court-Appointed Guardian
---
---
id: petitioner telephone number
question: |
  What is ${ users[0] } phone number?
fields:
  - Telephone number: users[0].telephone_number
    datatype: al_international_phone
---
id: question_1790104605424
question: "Proposed temporary guardian information"
fields:
  - Proposed Temporary Guardian name: "guardians[0].name"
  - code: |
      guardians[0].address.address_fields()
  - Proposed Temporary Guardian telephone number: "guardians[0].telephone_number"
    datatype: al_international_phone
  - "Proposed Temporary Guardian date of birth ": "guardians[0].birth_date"
    datatype: BirthDate
sets:
  - "guardians[0].address.address"
  - "guardians[0].address.city"
  - "guardians[0].address.zip"
  - "guardians[0].address.unit"
  - "guardians[0].address.state"
  - "guardians[0].address.country"
---
id: Guardianship Rights
question: |2
  Child's parents information
subquestion: |2
  List ALL people who have guardianship rights over the child. (For each person, list name, address, telephone number, including the date of birth for any person who is under the age of 18, any person in the military service
  or any person under conservatorship or legal disability)
fields:
  - "Mother's details": Mother_Parent
  - "Father's details (if you do not know, write unknown status)": FatherParent_If_father_is_unknown_so_state
  - label: Guardians of the minor child
    field: Guardians_of_the_Person_of_the_Minor_Child
    required: False
---
id: Reasons for Guardianship
question: |2
  Reasons for guardianship
fields:
  - Why are you making this request for guardianship?: Reasons
subquestion: "Illness, absence from the area, military leave, other "
---
id: Legal Proceedings
question: |2
  Legal proceedings
subquestion: |2+
  
fields:
  - Has the child been living in Connecticut for the past 6 months?: has_resided
    datatype: yesnoradio
  - "Is anyone fighting over or going to court about custody of this child, in any state?": current_proceeding
    datatype: yesnoradio
  - Has there been a proceeding in the past in Connecticut or any state affecting the custody of the child?: past_proceeding
    datatype: yesnoradio
  - Is there a current safety or service agreement between the Department of Children and Families and the parent/guardian of the minor child?: current_safety_service_agreement
    datatype: yesnoradio
  - Does anyone involved have a a current protective or restraining order? (if YES you must bring it to the court): current_protective_restraining_order
    datatype: yesnoradio
  - Has the court ordered someone to pay child support for this child?: preexisting_child_support_order
    datatype: yesnoradio
---
id: Guardianship Terms
question: |2
  When should the guardianship end? (1 year at most)
fields:
  - Guardianship end date: Termination_date
    datatype: date
    min: ${ today() }
    max: ${ today().plus(years=1) }
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
